# NOTE: -Djavax.net.ssl.trustStoreType=Windows-ROOT is a workaround for this
# machine, where a TLS-intercepting proxy/AV makes Java reject Gradle and
# Maven downloads that curl accepts. It tells the JVM to trust the Windows
# certificate store. Safe to delete on a machine without that proxy, or to
# move to ~/.gradle/gradle.properties so it is not tied to this project.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStoreType=Windows-ROOT
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Use the standalone JDK 17: Android Studio JBR fails to initialise the
# Windows-ROOT trust store this machine needs (see note above).
org.gradle.java.home=C:/Program Files/Java/jdk-17
